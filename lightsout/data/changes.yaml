# What's new in Lights Out, newest first. Written for the people using the app, not for developers.
# Every shipped feature gets an entry (kind: new | improved | fixed). `link` is where "Try it" goes.
# After editing: `.venv/bin/python tools/changelog.py` rewrites CHANGELOG.md (a test checks they match),
# and `.venv/bin/python tools/release.py` publishes the day's GitHub Release.

- date: 2026-10-16
  kind: improved
  title: Counting which pages get used
  text: The app now keeps a simple tally of how often each kind of page is opened (Home, series pages, live timing, the Race Wire, Pick'em and so on). It isn't tracking you. It never records who opened what, so not even the person running the app can see who clicked anything, just totals like "live timing was opened 40 times this week". It's strictly for deciding what to build and improve next. Tallies are kept for six months.
  link: "#/new"

- date: 2026-10-16
  kind: fixed
  title: NASCAR qualifying live timing
  text: NASCAR practice and qualifying no longer show "Lap 1 / 999". The lap count now appears only during races. The Pits column is also blank outside races, since it was counting every trip down pit road as a stop.
  link: "#/series/truck"

- date: 2026-10-16
  kind: new
  title: Qualifying results for the GT World Challenge
  text: GT World Challenge Europe, America and Asia and British GT now have a Qualifying tab on the series page and in Standings. It shows the newest round's qualifying, often before the race has run, with every session as a chip (Superpole, Combined, Q1, Q2, Q3, split groups, and GT3 and GT4 sessions at British GT). You get each car's position, class, crew and gap to pole, and followed drivers are highlighted. The round's event page lists it too. Asia and British GT also get Last race, so following a driver shows how they finished. Results appear within about an hour of the session ending. This isn't live timing; for that, use Official timing. The Intercontinental GT Challenge and GT World Challenge Australia only publish results as PDFs, so they're not included.
  link: "#/standings/gtwce/quali"

- date: 2026-10-15
  kind: fixed
  title: Right team names, everywhere
  text: Liam Lawson showed as Red Bull in the F1 standings because of his three-race stint there; drivers now show the team they raced for most recently, so a one-off swap shows for that week and then goes back. Teams also use their proper names (Red Bull Racing, Racing Bulls, Alpine, Haas, Cadillac), Formula E teams no longer appear twice in capitals, MotoGP classes lost some doubled names, NASCAR standings name the team as well as the make, GT World Challenge America's entry lists show teams instead of drivers in the team column, and F2 and F3 drivers now show their team in the standings, the last race and driver pages.
  link: "#/standings/f1/drivers"

- date: 2026-10-14
  kind: improved
  title: Driver cards, a countdown and team colours
  text: Everyone you follow now gets a card on Upcoming for each championship they're in, with their points, championship position, wins (F1 and NASCAR), the gap to the leader and a bar for every round so you can see their season form, all in their team's colours. Swipe between them on a phone. Below them, a big countdown to the next qualifying or race in a series you follow. Standings show each team's name in its colours too, and following a name no longer mixes up similar ones (Marc Márquez stopped matching Marcus Ericsson). Form bars cover the whole F1 season already; other series fill in from their next race.
  link: "#/"

- date: 2026-10-14
  kind: new
  title: IMSA, WorldSBK and Formula DRIFT
  text: Three more series. IMSA, America's big sportscar championship (the Rolex 24 at Daytona, the 12 Hours of Sebring, Petit Le Mans at Road Atlanta), is on by default, with every practice, qualifying and race once a weekend's schedule is posted, plus standings for GTP and, under the class picker, LMP2, GTD Pro and GTD. Next year's calendar is already in. WorldSBK (World Superbikes) has every session, standings and last race results. Formula DRIFT has practice, qualifying and the Top 32 and Top 16 battles, plus standings. There's a new Drifting chip in Filters. Switch WorldSBK and Formula DRIFT on in Series. Your calendar feed now follows what each series shows on Upcoming too, so a series set to Races only puts only its races in your calendar. Subscribe again from Settings to pick that up.
  link: "#/series"

- date: 2026-10-14
  kind: improved
  title: Tidier filters on Upcoming
  text: The filters on Upcoming are easier to read. The day is now one switch (Any day, Today, This weekend) so it's clear you pick one. Everything else sits behind a Filters button that shows how many are on, grouped as Watch (free to watch, Near me), Sessions and Racing type. With the panel closed, the filters you have on show as small chips under the switch, and tapping ✕ removes one.
  link: "#/"

- date: 2026-10-14
  kind: new
  title: Where every race is, track pages, and Near me
  text: Races now say where they are in words you'd use, like Braselton, GA, Elkhart Lake, WI, Phillip Island, VIC or Spielberg, Austria. Tap the place to open the track's page. It shows every series racing there this season and next (not just the ones you follow), what's on in the next two weeks with the forecast, and Apple Maps and Google Maps buttons. Set a home ZIP code (or use your location) in Settings → Near me and races show how far away they are. A new Near me filter on Upcoming lists every track in range with its next race, from any series, so you can see what's worth the drive.
  link: "#/settings/near"

- date: 2026-10-14
  kind: improved
  title: A calmer Upcoming, and pick what each series shows
  text: Upcoming now puts each race weekend in its own card. The series, event and where to watch appear once at the top, with one short line per session underneath, and races stand out in bold. You also choose how much of each series you see. On a series page (or next to its switch in Series), pick All sessions, Quali + races, or Races only. Follow a series casually, set it to Races only, and its practice and test sessions stop filling your list. Series pages use the same tidier layout.
  link: "#/series"

- date: 2026-10-14
  kind: new
  title: MotoGP, Moto2, Moto3 and five more GT championships
  text: Bikes have arrived. MotoGP is on the schedule with every practice, qualifying, sprint and race in your time zone, plus standings, last race results, news and weather at the track, and next year's calendar is already in. Moto2 and Moto3 are there too with the same detail; switch them on in Settings. There's a new Bikes chip in the Upcoming filters. For sportscar fans there are five more SRO championships, off by default so your schedule stays tidy. The Intercontinental GT Challenge (Bathurst 12 Hour, Spa 24 Hours, Indianapolis 8 Hour), GT World Challenge America, Asia and Australia, and British GT all come with full timetables. Entry lists for the Intercontinental GT Challenge and GT World Challenge America are included, so following a driver finds them there too, and all five stream free on GT World's YouTube channel.
  link: "#/series"

- date: 2026-10-14
  kind: new
  title: Pick'em for F1, NASCAR Cup and IndyCar
  text: A new Pick'em tab. Each race has five Duels, two drivers who usually finish close (teammates, or neighbours in the championship), and you pick who ends up ahead. That's 1 point each, and tap ★ on one duel to make it your lock, worth 2 (nothing if it's wrong). You can also call the podium, P1 to P3, for 1 point per driver who makes it and 2 for the exact spot. Duels appear 10 days before each race and picks close at lights out, which is when you see what your friends picked. Every series has its own season table. Settings → Pick'em sets the name friends see.
  link: "#/picks"

- date: 2026-10-13
  kind: new
  title: GT World Challenge standings and results
  text: GT World Challenge Europe now has standings and results like the other big series. The Drivers tab shows the overall championship by crew (the two or three drivers who share a car), with chips for the Endurance Cup, the Sprint Cup and the Gold, Silver and Bronze classes; Teams shows the teams' championship; Last race has the full finishing order with car number, team and class.
  link: "#/standings/gtwce/drivers"

- date: 2026-10-13
  kind: improved
  title: A new menu and faster tabs
  text: The menu has moved to the bottom of the screen with icons (Upcoming, Wire, Standings, Series), Settings is a gear button at the top, and both tuck away while you scroll down so the schedule gets the whole screen, then come back as soon as you scroll up. Switching tabs is much quicker too, because the app now keeps the other tabs ready in the background. Pages you reach from elsewhere have a Back button at the top.
  link: "#/"

- date: 2026-10-13
  kind: new
  title: Page animations
  text: Moving around the app now has a little snap to it. A new page comes in fast from the side, overshoots a touch and settles, and the highlight in the menu slides to the tab you picked. It's over in under a third of a second and only starts once the page is ready. Prefer instant? Settings → Display → Animations between pages turns it off (it's also off when your phone's Reduce Motion setting is on).
  link: "#/settings"

- date: 2026-10-13
  kind: new
  title: Report a problem
  text: Found something off, or have an idea? Tap "Something wrong? Report it" at the bottom of any page (or Settings → Report a problem). It goes straight onto the app's to-do list on GitHub without your name or email, along with which page you were on and what phone you're using, so there's no need to explain that part. Settings → Your reports shows whether it's been fixed, plus any reply.
  link: "#/report"

- date: 2026-10-12
  kind: new
  title: Event pages
  text: "Tap any race weekend (on Upcoming or a series page) for everything about it in one place: the schedule with where to watch and the weather, which of your drivers are there, the full entry list, results and the Race story afterwards, tickets, news about it, and the other series racing at the same track that weekend."
  link: "#/series/f1"

- date: 2026-10-12
  kind: new
  title: Weather at the track
  text: "Sessions in the next 7 days show the forecast at the track for when they start: sky, temperature and chance of rain (in blue when it's 10% or more). It updates every few hours, and every hour on the day. Pick °F or °C in Settings."
  link: "#/"

- date: 2026-10-12
  kind: new
  title: Filters on Upcoming
  text: "Narrow Upcoming to Today or This weekend, to Races, Qualifying or Practice, to a type of racing (single seaters, sportscars and GT, stock cars, rally and off-road), or to sessions that are free to watch. Your filters are remembered on each device."
  link: "#/"

- date: 2026-10-12
  kind: new
  title: Season progress and official links
  text: "Each series page shows how far through the season it is (17 of 23 rounds done, and what's next), plus buttons to the series' official site and its official live timing."
  link: "#/series/f1"

- date: 2026-10-12
  kind: fixed
  title: NASCAR last race
  text: "Cup, O'Reilly and Truck Series Last race showed nothing while NASCAR's official results were still being posted. It now shows the finishing order straight from the race's timing (marked unofficial, without points) until the official results arrive, with the winner's race time and everyone else's gap to the winner (+0.029, 2 laps down, Out on lap 76)."
  link: "#/standings/cup/last"

- date: 2026-10-12
  kind: new
  title: Standings tab
  text: "Every championship in one place, from the top bar: pick a series, then Drivers, Teams or Last race. Your series come first, and it remembers the last one you looked at. Pages you open from elsewhere (a series, a driver, a Race story, live timing) now have a Back link, and on phones Settings is the gear icon."
  link: "#/standings"

- date: 2026-10-12
  kind: improved
  title: Offline page
  text: If the server Lights Out runs on goes down (a power or internet blip at its home), the app shows a short "Lights Out is offline" page instead of an error, and reloads by itself once it's back. Your phone picks this up the next time you open the app.
  link: "#/"

- date: 2026-10-12
  kind: fixed
  title: Home screen icon
  text: Phones showed an "L" instead of the app's icon on the home screen. Remove the app from your home screen and add it again to get the real one (on iPhone, turn alerts back on afterwards in Settings).
  link: "#/app"

- date: 2026-10-12
  kind: new
  title: Nürburgring NLS
  text: "The Nordschleife endurance series Verstappen races in: this season's races and the eight 2027 dates (from March 20), free on the NLS YouTube channel, with the series' news in the Race Wire. NLS publishes no entry lists, so drivers show up through its race previews."
  link: "#/series/nls"

- date: 2026-10-12
  kind: new
  title: What's new
  text: This page. A dot on Settings and a banner on Upcoming show when something new has been added.
  link: "#/new"

- date: 2026-10-12
  kind: improved
  title: F1 tickets for each Grand Prix
  text: F1 ticket links go straight to that Grand Prix's page on the F1 store. F1 Academy, F2 and F3 link to the Grand Prix weekend they race at.
  link: "#/series/f1"

- date: 2026-10-12
  kind: new
  title: Driver pages
  text: Tap any name in Following to see where they race (team and car number in every series), their next qualifying and races, championship position, last result and news.
  link: "#/"

- date: 2026-10-12
  kind: new
  title: Ticket links
  text: Race days have a Tickets link to each series' official ticket page, or the event page where there isn't one.
  link: "#/"

- date: 2026-10-12
  kind: new
  title: GT World Challenge Europe
  text: Every round's schedule and entry list, free on GT World's YouTube. Follows find drivers who drop in for a round, like Max Verstappen at Portimão.
  link: "#/series/gtwce"

- date: 2026-10-11
  kind: new
  title: Alerts
  text: Push notifications for race starts, cautions and red flags, the drivers you follow (incidents, penalties, retirements, taking the lead), results and news. Pick which in Settings.
  link: "#/app"

- date: 2026-10-11
  kind: new
  title: Race events and Race stories
  text: Live timing shows what's happening - penalties, safety cars, cautions with their cause, retirements, lead changes - and every event keeps a lap-by-lap Race story afterwards.
  link: "#/series"

- date: 2026-10-11
  kind: new
  title: The Race Wire
  text: Racing news from Motorsport.com, Autosport, RACER, The Race and DirtFish plus the big race moments, filtered by series, team or driver.
  link: "#/wire"

- date: 2026-10-11
  kind: improved
  title: Your settings follow you
  text: Follows, series and calendar choices are saved to your account, so they're the same on every device.
  link: "#/settings"

- date: 2026-10-11
  kind: new
  title: NASCAR
  text: The Cup Series, O'Reilly Auto Parts Series and Truck Series, with each race's TV network and live timing.
  link: "#/series/cup"

- date: 2026-10-11
  kind: new
  title: Live timing
  text: Live leaderboards for F1, F2, F3, F1 Academy, WRC, NASCAR and IndyCar, connected only while a session is running.
  link: "#/series"

- date: 2026-10-11
  kind: new
  title: Standings and results
  text: Championship tables and the last race's results for F1, F2, F3, F1 Academy, IndyCar, Formula E and WRC.
  link: "#/series"

- date: 2026-10-11
  kind: new
  title: Follow drivers anywhere
  text: Follow a driver or team by name - spelling doesn't need to be perfect - and Lights Out watches every grid and entry list for them, with a NEW badge when they're entered somewhere.
  link: "#/settings"

- date: 2026-10-11
  kind: new
  title: Lights Out opens
  text: Schedules for every series in one place, a calendar feed for your phone, and US where-to-watch badges that make free versus paid obvious.
  link: "#/"
