# Teams for news and race-event tagging: the name shown in the app, then the everyday names stories use.
# Grid team names that differ from a canonical name map onto it through `grid:`.
# NASCAR grids list the manufacturer, not the team, so its teams are all hand-kept here.

f1:
  Red Bull Racing: { aliases: [Red Bull], grid: [Red Bull] }
