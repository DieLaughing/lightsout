# Team colours for driver cards and standings: a word in the team's name -> its colour. The longest match wins
# ("Red Bull KTM" beats "Red Bull"), case doesn't matter, and every series shares one list. Colours only, never logos.
# NASCAR rows name the manufacturer ("#24 · Chevrolet"), so stock cars take the manufacturer's colour.
# No match = the series colour.

