# Where races happen, for the weather forecast. Matched against "<venue> <event name>" (lowercase, no accents);
# the FIRST place with a matching term wins, so specific terms come before general ones.
# Rallies have no venue in the feeds, so they match on the rally's name and use its service park / HQ town.
# Coordinates only need to be within a few km. Missing a place = no weather shown, nothing breaks.
# A test checks every term is unique and every point is on the planet; add new tracks as series add them.

